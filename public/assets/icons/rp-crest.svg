<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="rpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="goldFacet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="goldFacet3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#rpGlow)"/>
  <g filter="url(#dropShadow)" transform="translate(0.5, 0)">
    <!-- Left Wing -->
    <path d="M14 14 L2 25 L6 28 L6 40 L2 45 L28 61 L28 51 L14 41 Z" fill="url(#goldFacet2)" stroke="#713f12" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Right Wing -->
    <path d="M50 14 L62 25 L58 28 L58 40 L62 45 L36 61 L36 51 L50 41 Z" fill="url(#goldFacet3)" stroke="#713f12" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Center Crystal Diamond Column -->
    <polygon points="32,3 42,11 42,39 32,46 22,39 22,11" fill="url(#goldFacet1)" stroke="#a16207" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Center Inner Diamond Highlight -->
    <polygon points="32,7 39,13 39,37 32,42 25,37 25,13" fill="url(#goldFacet3)" opacity="0.75"/>
    <polygon points="32,9 37,13 32,39 27,13" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>